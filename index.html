function detail(c){let k=monthKey(),arr=state.entries.filter(e=>e.date.startsWith(k)&&e.type==="expense"&&e.cat===c);document.getElementById("modal").innerHTML=`<div class="modal"><div class="sheet entry-sheet expense-mode"><button type="button" class="close" id="detailClose" onclick="closeModal()" ontouchend="closeModal()">×</button><h2>${esc(c)}</h2><div class="grid2"><div class="stat">預算<b>${money(budget(k,c))}</b></div><div class="stat">已花<b class="red">${money(spent(k,c))}</b></div></div>${records(arr.slice().reverse())}</div></div>`;
 const mb=document.getElementById("modal");
 mb.addEventListener("click",function(e){if(e.target.closest("#detailClose")||e.target===mb.firstElementChild)closeModal()});
}
function accounts(){return `<div class="page"><div class="card"><b>我的帳戶</b>${state.accounts.map(a=>`<div class="budgetline"><div class="row"><span>${a.emoji} ${esc(a.name)}</span><b>${money(accBal(a))}</b></div><div class="small">初始餘額 ${money(a.initial)}</div></div>`).join("")}</div><div class="card"><div class="row"><b>帳戶規則</b><button class="pill" onclick="addAccount()">＋新增</button></div><div class="small" style="line-height:1.8;margin-top:8px">指定帳戶的收入／支出會影響該帳戶；不指定帳戶只進總帳與統計。</div></div></div>`}
function addAccount(){let n=prompt("帳戶名稱");if(!n)return;let i=Number(prompt("初始餘額","0"))||0;state.accounts.push({id:"a"+Date.now(),name:n,emoji:"🏦",initial:i});save()}
function bind(){document.querySelectorAll(".nav button[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}render();refreshAuth();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
