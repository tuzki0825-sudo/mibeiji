<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e7">
<link rel="manifest" href="manifest.json">
<title>米杯記帳</title>
<style>
:root{--bg:#f7f1e7;--card:#fffaf2;--ink:#40382f;--muted:#8b8176;--line:#eadfD1;--accent:#b77b4b;--green:#63866d;--red:#bd655c;--shadow:0 8px 24px rgba(90,65,40,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
button,input,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:92px}
header{padding:28px 20px 14px;display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:4px}
.page{padding:0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:10px 0;box-shadow:var(--shadow)}
.hero{font-size:14px;color:var(--muted)}.big{font-size:32px;font-weight:800;margin:5px 0 14px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:13px;border:1px solid var(--line);border-radius:15px}.stat b{display:block;font-size:20px;margin-top:4px}.green{color:var(--green)}.red{color:var(--red)}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,250,242,.96);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}.nav button{background:none;color:var(--muted);width:20%;max-width:124px;padding:10px 3px 9px;font-size:12px}.nav .on{color:var(--accent);font-weight:700}.ico{font-size:22px;display:block}
.pill{display:inline-block;background:#efe3d4;border-radius:999px;padding:6px 10px;font-size:12px}.tabs{display:flex;background:#eee4d7;border-radius:13px;padding:3px;margin:10px 0}.tabs button{flex:1;background:none;padding:8px;border-radius:10px;color:var(--muted)}.tabs .active{background:#fffaf2;color:var(--ink);font-weight:700}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fffdf9;color:var(--ink);outline:none}.field{margin:9px 0}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.keypad button{padding:14px;background:#f0e5d8;border-radius:13px;font-size:18px}.amount{text-align:right;font-size:34px;font-weight:800;padding:12px 4px}
.typebtn{padding:9px 16px;border-radius:999px;background:#eee4d7;color:var(--muted)}.typebtn.active{background:var(--accent);color:white}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cat{background:#f4e9dc;border:1px solid transparent;border-radius:14px;padding:12px 5px;text-align:center}.cat.sel{border-color:var(--accent);background:#fff7ed}
.record{padding:11px 0;border-bottom:1px solid var(--line)}.record:last-child{border-bottom:0}.small{font-size:12px;color:var(--muted)}
.progress{height:9px;background:#eadfd2;border-radius:99px;overflow:hidden;margin:9px 0}.bar{height:100%;background:var(--accent);border-radius:99px}.bar.over{background:var(--red)}
.budgetline{padding:13px 0;border-bottom:1px solid var(--line)}.budgetline:last-child{border-bottom:0}.money{font-weight:750}
.modal{position:fixed;inset:0;background:rgba(60,45,35,.28);display:flex;align-items:flex-end;z-index:20}.sheet{background:var(--bg);width:100%;max-width:620px;margin:auto;border-radius:24px 24px 0 0;padding:20px;max-height:90vh;overflow:auto}.close{float:right;background:#eadfd2;border-radius:50%;width:32px;height:32px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
</style>
</head>
<body><div class="app">
<header><div><h1>米杯記帳</h1><div class="sub" id="dateText"></div></div><span class="pill">V4 預算版</span></header>
<main id="root"></main>
<nav class="nav">
<button data-page="home"><span class="ico">🏠</span>首頁</button>
<button data-page="income"><span class="ico">💰</span>我的收入</button>
<button data-page="stats"><span class="ico">📊</span>統計</button>
<button data-page="budget"><span class="ico">🎯</span>預算</button>
<button data-page="accounts"><span class="ico">🏦</span>帳戶</button>
</nav></div>
<div id="modal"></div>
<script>
const KEY="mibeiji_v4";
const old=JSON.parse(localStorage.getItem("mibeiji_v3")||"null");
let state=JSON.parse(localStorage.getItem(KEY)||"null")||old||{
 entries:[],cats:[["🍚","吃飯"],["🏠","房租"],["🚗","交通"],["🎮","娛樂"],["📌","固定支出"]],
 accounts:[{id:"cash",name:"現金",emoji:"💵",initial:0},{id:"bank",name:"銀行",emoji:"🏦",initial:0},{id:"card",name:"信用卡",emoji:"💳",initial:0}],
 budgets:{}
};
if(!state.budgets)state.budgets={};
localStorage.setItem(KEY,JSON.stringify(state));
let page="home",type="expense",amount="",selectedCat=state.cats[0]?.[1]||"吃飯",selectedAccount="";
const money=n=>"$"+Math.round(n).toLocaleString("zh-TW");
const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render()};
const today=()=>new Date().toISOString().slice(0,10);
document.getElementById("dateText").textContent=new Date().toLocaleDateString("zh-TW",{year:"numeric",month:"long",day:"numeric"});
function accBal(a){return a.initial+state.entries.filter(e=>e.accountId===a.id).reduce((s,e)=>s+(e.type==="income"?e.amount:-e.amount),0)}
function monthKey(d=today()){return d.slice(0,7)}
function budget(k,cat){return Number(state.budgets[k]?.[cat]||0)}
function spent(k,cat){return state.entries.filter(e=>e.date.startsWith(k)&&e.type==="expense"&&e.cat===cat).reduce((s,e)=>s+e.amount,0)}
function inc(k){return state.entries.filter(e=>e.date.startsWith(k)&&e.type==="income").reduce((s,e)=>s+e.amount,0)}
function exp(k){return state.entries.filter(e=>e.date.startsWith(k)&&e.type==="expense").reduce((s,e)=>s+e.amount,0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.page===page));let r=document.getElementById("root");r.innerHTML=page==="home"?home():page==="income"?income():page==="stats"?stats():page==="budget"?budgetPage():accounts();bind()}
function home(){
 let assets=state.accounts.reduce((s,a)=>s+accBal(a),0),k=monthKey();
 return `<div class="page"><div class="card"><div class="hero">目前帳戶資產</div><div class="big">${money(assets)}</div><div class="grid2"><div class="stat">本月收入<b class="green">${money(inc(k))}</b></div><div class="stat">本月支出<b class="red">${money(exp(k))}</b></div></div></div>
 <div class="card"><div class="row"><b>本月預算</b><span class="small">${money(exp(k))} / ${money(Object.values(state.budgets[k]||{}).reduce((a,b)=>a+Number(b||0),0))}</span></div><div class="progress"><div class="bar" style="width:${Math.min(100,(exp(k)/(Object.values(state.budgets[k]||{}).reduce((a,b)=>a+Number(b||0),0)||1))*100)}%"></div></div><button class="pill" onclick="page='budget';render()">查看本月預算 →</button></div>
 <div class="card"><b>快速記帳</b>${entryForm()}</div><div class="card"><b>最近紀錄</b>${records(state.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6))}</div></div>`
}
function entryForm(){return `<div class="row" style="margin:12px 0"><button class="typebtn ${type==="expense"?"active":""}" onclick="type='expense';render()">支出</button><button class="typebtn ${type==="income"?"active":""}" onclick="type='income';render()">收入</button><div class="amount">${money(Number(amount)||0)}</div></div>
<div class="catgrid">${state.cats.map(c=>`<button class="cat ${selectedCat===c[1]?"sel":""}" onclick="selectedCat='${esc(c[1])}';render()">${c[0]}<br><span class="small">${esc(c[1])}</span></button>`).join("")}</div>
<div class="field"><label>帳戶（不指定就不改任何帳戶餘額）</label><select id="account">${`<option value="">不指定帳戶</option>`+state.accounts.map(a=>`<option value="${a.id}" ${selectedAccount===a.id?"selected":""}>${a.emoji} ${esc(a.name)}</option>`).join("")}</select></div>
<div class="field"><input id="note" placeholder="備註（可不填）"></div><div class="keypad">${["1","2","3","4","5","6","7","8","9","00","0","⌫"].map(k=>`<button onclick="key('${k}')">${k}</button>`).join("")}</div><button onclick="addEntry()" style="width:100%;padding:14px;margin-top:9px;border-radius:13px;background:var(--accent);color:#fff;font-weight:700">加入${type==="expense"?"支出":"收入"}</button>`}
function key(k){if(k==="⌫")amount=amount.slice(0,-1);else if(amount.length<9)amount+=k;render()}
function addEntry(){let n=Number(amount);if(!n)return alert("請輸入金額");let a=document.getElementById("account").value;state.entries.push({id:Date.now(),type,amount:n,cat:type==="income"?"收入":selectedCat,accountId:a||null,note:document.getElementById("note").value,date:today()});amount="";selectedAccount=a;save()}
function records(arr){if(!arr.length)return `<div class="empty">目前沒有紀錄</div>`;return arr.map(e=>`<div class="record"><div class="row"><span>${e.type==="income"?"💰":"🧾"} ${esc(e.cat)}</span><span class="${e.type==="income"?"green":"red"} money">${e.type==="income"?"+":"-"}${money(e.amount)}</span></div><div class="small">${e.date}${e.note?" · "+esc(e.note):""}${e.accountId?" · "+esc(state.accounts.find(a=>a.id===e.accountId)?.name||""):" · 不指定帳戶"}</div><button class="small" onclick="del(${e.id})">刪除</button></div>`).join("")}
function del(id){if(confirm("確定刪除這筆紀錄？")){state.entries=state.entries.filter(e=>e.id!==id);save()}}
function income(){let total=state.entries.filter(e=>e.type==="income").reduce((s,e)=>s+e.amount,0);return `<div class="page"><div class="card"><div class="hero">累計收入</div><div class="big green">${money(total)}</div><div class="small">每筆收入都會自動納入統計；只有指定帳戶時才會增加該帳戶餘額。</div></div><div class="card"><b>收入紀錄</b>${records(state.entries.filter(e=>e.type==="income").slice().reverse())}</div></div>`}
function stats(){let k=monthKey(),cats=state.cats.map(c=>[c[1],spent(k,c[1])]).sort((a,b)=>b[1]-a[1]);return `<div class="page"><div class="card"><b>本月統計</b><div class="grid2" style="margin-top:12px"><div class="stat">收入<b class="green">${money(inc(k))}</b></div><div class="stat">支出<b class="red">${money(exp(k))}</b></div></div><div class="stat" style="margin-top:10px">淨金流<b class="${inc(k)-exp(k)>=0?"green":"red"}">${money(inc(k)-exp(k))}</b></div></div><div class="card"><b>各項目花費</b>${cats.map(x=>`<div class="budgetline"><div class="row"><span>${esc(x[0])}</span><b>${money(x[1])}</b></div></div>`).join("")}</div><div class="card"><b>本月交易明細</b>${records(state.entries.filter(e=>e.date.startsWith(k)))}</div></div>`}
function budgetPage(){let k=monthKey(),bs=state.budgets[k]||{};return `<div class="page"><div class="card"><div class="row"><div><div class="hero">${k.replace("-"," 年 ")} 月預算</div><div class="big">${money(inc(k))}</div></div><button class="pill" onclick="setIncomeBudget()">設定預期收入</button></div><div class="grid2"><div class="stat">預計支出<b>${money(Object.values(bs).reduce((a,b)=>a+Number(b||0),0))}</b></div><div class="stat">實際支出<b class="red">${money(exp(k))}</b></div></div></div>
<div class="card"><div class="row"><b>預算分配</b><button class="pill" onclick="addCat()">＋新增分類</button></div>${state.cats.map(c=>{let b=budget(k,c[1]),s=spent(k,c[1]),pct=b?Math.round(s/b*100):0;return `<div class="budgetline"><div class="row"><span>${c[0]} ${esc(c[1])}</span><span class="${pct>100?"red":""}">${money(s)} / ${money(b)}</span></div><div class="progress"><div class="bar ${pct>100?"over":""}" style="width:${Math.min(100,pct)}%"></div></div><div class="row small"><span>${b?pct+"% 已使用":"尚未設定預算"}</span><button class="pill" onclick="detail('${esc(c[1])}')">查看明細</button></div></div>`}).join("")}</div></div>`}
function setIncomeBudget(){let k=monthKey(),v=prompt("輸入本月預期收入",state.budgets[k]?.income||"");if(v!==null){state.budgets[k]=state.budgets[k]||{};state.budgets[k].income=Number(v)||0;save()}}
function setBudget(cat){let k=monthKey(),v=prompt("設定「"+cat+"」本月預算",budget(k,cat));if(v!==null){state.budgets[k]=state.budgets[k]||{};state.budgets[k][cat]=Number(v)||0;save()}}
function addCat(){let n=prompt("新增分類名稱");if(!n)return;let emoji=prompt("分類圖示，例如 🍔","🛍️")||"📌";state.cats.push([emoji,n]);save()}
function detail(cat){let k=monthKey(),arr=state.entries.filter(e=>e.date.startsWith(k)&&e.type==="expense"&&e.cat===cat);document.getElementById("modal").innerHTML=`<div class="modal" onclick="if(event.target===this)this.innerHTML=''"><div class="sheet"><button class="close" onclick="document.getElementById('modal').innerHTML=''">×</button><h2>${esc(cat)}</h2><div class="grid2"><div class="stat">預算<b>${money(budget(k,cat))}</b></div><div class="stat">已花<b class="red">${money(spent(k,cat))}</b></div></div><button onclick="setBudget('${esc(cat)}')" style="width:100%;padding:13px;margin:12px 0;border-radius:13px;background:var(--accent);color:#fff">設定／修改預算</button><b>消費明細</b>${records(arr.slice().reverse())}</div></div>`}
function accounts(){return `<div class="page"><div class="card"><b>我的帳戶</b>${state.accounts.map(a=>`<div class="budgetline"><div class="row"><span>${a.emoji} ${esc(a.name)}</span><b>${money(accBal(a))}</b></div><div class="small">初始餘額 ${money(a.initial)}</div></div>`).join("")}</div><div class="card"><div class="row"><b>帳戶規則</b><button class="pill" onclick="addAccount()">＋新增</button></div><div class="small" style="line-height:1.8;margin-top:8px">指定帳戶的交易會影響該帳戶餘額；選「不指定帳戶」只記在總帳與統計，不會改變任何帳戶餘額。</div></div></div>`}
function addAccount(){let n=prompt("帳戶名稱");if(!n)return;let init=Number(prompt("初始餘額","0"))||0;state.accounts.push({id:"a"+Date.now(),name:n,emoji:"🏦",initial:init});save()}
function bind(){document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
