<script>

/* V25 Multi-book Cloud Sync */
const SUPABASE_URL="https://zejlyvatmdcsgytticyn.supabase.co";
const SUPABASE_KEY="sb_publishable_UyN0WE_S8lxaQjuQ-px7Hg_tA1TcCY1";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let cloudUser=null, cloudBookId=null, cloudBusy=false, cloudProfile={display_name:""}, cloudBooks=[];
let cloudLastUpdatedAt=localStorage.getItem("mibeiji_cloud_updated_at")||"";
let cloudDirty=false, cloudAutoTimer=null;
const hapticObserver=new MutationObserver(()=>document.querySelectorAll("#modal button,.nav button,#authPill").forEach(wireHaptic));
hapticObserver.observe(document.getElementById("modal"),{childList:true,subtree:true});
function haptic(el){if(navigator.vibrate)navigator.vibrate(10);if(el){el.classList.add("is-pressed");setTimeout(()=>el.classList.remove("is-pressed"),110)}}
function wireHaptic(el){if(!el||el.dataset.haptic==="1")return;el.dataset.haptic="1";el.addEventListener("pointerdown",()=>haptic(el),{passive:true})}
async function loadCloudProfile(){cloudProfile={display_name:localStorage.getItem("mibeiji_display_name")||""};if(!cloudUser)return cloudProfile;const {data,error}=await sb.from("profiles").select("display_name").eq("id",cloudUser.id).maybeSingle();if(error)throw error;if(data){cloudProfile=data;localStorage.setItem("mibeiji_display_name",data.display_name||"");}else{const {data:p,error:pe}=await sb.from("profiles").upsert({id:cloudUser.id,display_name:""},{onConflict:"id"}).select("display_name").single();if(pe)throw pe;cloudProfile=p||{display_name:""};}return cloudProfile}
async function saveCloudProfile(){
  if(!cloudUser)return;
  const name=(document.getElementById("displayName")?.value||"").trim().slice(0,30);
  const icon=document.getElementById("displayIcon")?.value||localStorage.getItem("mibeiji_display_icon")||"🙂";
  if(!name){alert("請輸入顯示名稱");return;}
  const {error}=await sb.from("profiles").upsert({id:cloudUser.id,display_name:name},{onConflict:"id"});
  if(error)throw error;
  cloudProfile={display_name:name};
  localStorage.setItem("mibeiji_display_name",name);
  localStorage.setItem("mibeiji_display_icon",icon);
  updateHeaderPills();
  const status=document.getElementById("cloudStatus");
  if(status)status.innerHTML=`登入帳號：${esc(cloudUser.email||"")}<br>目前帳簿：<b>${esc(bookLabel(activeBook()))}</b>${activeBook()?`（${activeBook().book_type==='shared'?'共享':'私人'}）`:""}`;
  alert("✅ 顯示名稱已儲存");
}
function selectProfileIcon(icon){const h=document.getElementById("displayIcon"),p=document.getElementById("profileIconPreview");if(h)h.value=icon;if(p)p.textContent=icon;document.querySelectorAll(".profile-icon-option").forEach(b=>b.classList.toggle("sel",b.textContent===icon));}
async function signOutCloud(){
  try{
    stopCloudAutoSync();
    const {error}=await sb.auth.signOut();
    if(error)throw error;
    cloudUser=null; cloudProfile={display_name:""}; cloudBooks=[]; cloudBookId=null; cloudDirty=false; cloudLastUpdatedAt="";
    localStorage.removeItem("mibeiji_active_book_id");
    localStorage.removeItem("mibeiji_cloud_updated_at");
    const pill=document.getElementById("authPill");
    updateBookPill();
    closeModal();
    alert("已登出雲端帳號");
  }catch(e){
    console.error("登出失敗",e);
    alert("登出失敗："+(e.message||e));
  }
}
function cloudDisplayName(){return(cloudProfile.display_name||cloudUser?.email?.split("@")[0]||"使用者").trim()}
function cloudDisplayIcon(){return localStorage.getItem("mibeiji_display_icon")||"🙂"}
function activeBook(){return cloudBooks.find(b=>b.id===cloudBookId)||null}
function bookLabel(b){return b?.name||"我的帳簿"}
function bookKind(b){return b?.book_type==="shared"?"shared":"personal"}
async function loadCloudBooks(){
 if(!cloudUser)return [];
 const {data,error}=await sb.rpc("list_my_books");
 if(error)throw error;
 cloudBooks=(data||[]).map(b=>({...b,role:b.role||"member"}));
 return cloudBooks;
}
async function ensureCloudBook(preferredId=null){
 if(!cloudUser)return null;
 await loadCloudBooks();
 const saved=preferredId||localStorage.getItem("mibeiji_active_book_id");
 let chosen=cloudBooks.find(b=>b.id===saved);
 if(!chosen)chosen=cloudBooks.find(b=>b.book_type!=="shared")||cloudBooks[0];
 if(chosen){cloudBookId=chosen.id;localStorage.setItem("mibeiji_active_book_id",cloudBookId);return cloudBookId}
 const {data:book,error:be}=await sb.from("books").insert({name:"我的帳簿",owner_id:cloudUser.id,book_type:"personal"}).select("id,name,owner_id,book_type,invite_code").single();
 if(be)throw be;
 const {error:ae}=await sb.from("book_members").insert({book_id:book.id,user_id:cloudUser.id,role:"owner"});
 if(ae)throw ae;
 cloudBookId=book.id;localStorage.setItem("mibeiji_active_book_id",cloudBookId);await loadCloudBooks();return cloudBookId;
}
async function getSnapshot(bookId=cloudBookId){
 if(!bookId)await ensureCloudBook();
 const {data,error}=await sb.rpc("get_book_snapshot",{p_book_id:bookId});
 if(error)throw error; const row=Array.isArray(data)?data[0]:data; return row||null;
}
async function uploadSnapshot(bookId=cloudBookId, stateToUpload=state){
 if(!cloudUser)return;if(!bookId)await ensureCloudBook();
 const updatedAt=new Date().toISOString();
 const payload={...stateToUpload,_mibeiji_version:41,_mibeiji_book_id:bookId};
 const {data,error}=await sb.rpc("save_book_snapshot",{p_book_id:bookId,p_payload:payload,p_updated_at:updatedAt});
 if(error)throw error; const row=Array.isArray(data)?data[0]:data;
 cloudLastUpdatedAt=row?.updated_at||updatedAt;localStorage.setItem("mibeiji_cloud_updated_at",cloudLastUpdatedAt);cloudDirty=false;
}
async function syncBook(bookId=cloudBookId,fromLogin=false,silent=false,forceRemote=false){
 if(cloudBusy||!cloudUser||!bookId)return;cloudBusy=true;
 try{const snap=await getSnapshot(bookId);if(!snap){await uploadSnapshot(bookId,state);if(!silent)alert("☁️ 這本帳簿的雲端資料是空的，已把目前資料上傳。");return}
  const remoteAt=snap.updated_at||"";
  if(fromLogin){state=normalizeState(snap.payload);localStorage.setItem(KEY,JSON.stringify(state));cloudLastUpdatedAt=remoteAt;localStorage.setItem("mibeiji_cloud_updated_at",remoteAt);cloudDirty=false;render();if(!silent)alert("☁️ 已載入「"+bookLabel(activeBook())+"」");return}
  if(cloudDirty){await uploadSnapshot(bookId,state);
    if(forceRemote){const fresh=await getSnapshot(bookId);const fr=fresh?.updated_at||"";if(fresh){state=normalizeState(fresh.payload);localStorage.setItem(KEY,JSON.stringify(state));cloudLastUpdatedAt=fr;localStorage.setItem("mibeiji_cloud_updated_at",fr);render();}}
  }
  else if(forceRemote){state=normalizeState(snap.payload);localStorage.setItem(KEY,JSON.stringify(state));cloudLastUpdatedAt=remoteAt;localStorage.setItem("mibeiji_cloud_updated_at",remoteAt);render()}
  else if(remoteAt&&(!cloudLastUpdatedAt||new Date(remoteAt)>new Date(cloudLastUpdatedAt))){state=normalizeState(snap.payload);localStorage.setItem(KEY,JSON.stringify(state));cloudLastUpdatedAt=remoteAt;localStorage.setItem("mibeiji_cloud_updated_at",remoteAt);render()}
  else if(!cloudLastUpdatedAt){cloudLastUpdatedAt=remoteAt;localStorage.setItem("mibeiji_cloud_updated_at",remoteAt)}
 }catch(e){console.error("雲端同步失敗",e);if(!silent)alert("同步失敗："+(e.message||e))}finally{cloudBusy=false}}
async function syncCloud(silent=false,forceRemote=false){await ensureCloudBook();await syncBook(cloudBookId,false,silent,forceRemote)}
async function switchCloudBook(id){
 if(id===cloudBookId)return;
 if(!cloudUser)return;
 if(cloudDirty&&cloudBookId){await uploadSnapshot(cloudBookId,state)}
 const target=cloudBooks.find(b=>b.id===id);if(!target)return;
 cloudBookId=id;localStorage.setItem("mibeiji_active_book_id",id);updateBookPill();cloudLastUpdatedAt="";localStorage.removeItem("mibeiji_cloud_updated_at");
 const snap=await getSnapshot(id);state=snap?normalizeState(snap.payload):normalizeState({});localStorage.setItem(KEY,JSON.stringify(state));cloudDirty=false;render();openAuth();
}
async function createSharedBook(){
 if(!cloudUser)return;

async function signInCloud(){
  const email=(document.getElementById("authEmail")?.value||"").trim();
  const pass=document.getElementById("authPass")?.value||"";
  if(!email||!pass){alert("請輸入 Email 與密碼");return;}
  const btn=[...document.querySelectorAll("#modal button")].find(b=>b.textContent.includes("登入"));

  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error)throw error;
    cloudUser=data?.user||null;
    if(!cloudUser)throw new Error("登入成功但沒有取得使用者資訊");
    cloudProfile={display_name:""};

  }finally{
    if(btn){btn.disabled=false;btn.textContent="登入";}
  }
}
async function signUpCloud(){

}
function moveCat(kind,i,dir){let list=kind==='income'?state.incomeCats:state.cats,n=i+dir;if(n<0||n>=list.length)return;[list[i],list[n]]=[list[n],list[i]];save();manageCategories(kind)}
function renameCat(kind,i){let list=kind==='income'?state.incomeCats:state.cats,old=list[i]?.[1];if(!old)return;let n=prompt('分類名稱',old);if(n===null)return;n=n.trim();if(!n||n===old)return;if(list.some((c,j)=>j!==i&&c[1]===n)){alert('這個分類已存在');return;}if(kind==='expense'){for(const k in state.budgets){if(Object.prototype.hasOwnProperty.call(state.budgets[k],old)){state.budgets[k][n]=state.budgets[k][old];delete state.budgets[k][old]}}}list[i][1]=n;save();manageCategories(kind)}
function deleteCat(kind,i){let list=kind==='income'?state.incomeCats:state.cats,c=list[i];if(!c)return;if(!confirm(`確定刪除「${c[1]}」？\n以前的帳目會保留，以後新增記帳不再顯示。`))return;list.splice(i,1);save();manageCategories(kind)}
function addManagedCat(kind){let list=kind==='income'?state.incomeCats:state.cats,n=prompt('新增'+(kind==='income'?'收入':'支出')+'分類名稱');if(!n)return;n=n.trim();if(!n)return;if(list.some(c=>c[1]===n)){alert('這個分類已存在');return;}list.push([prompt('圖示','📌')||'📌',n]);save();manageCategories(kind)}
function detail(c){let k=monthKey(),arr=state.entries.filter(e=>e.date.startsWith(k)&&e.type==="expense"&&e.cat===c);document.getElementById("modal").innerHTML=`<div class="modal"><div class="sheet entry-sheet expense-mode"><button type="button" class="close" id="detailClose" onclick="closeModal()" ontouchend="closeModal()">×</button><h2>${esc(c)}</h2><div class="grid2"><div class="stat">預算<b>${money(budget(k,c))}</b></div><div class="stat">已花<b class="red">${money(spent(k,c))}</b></div></div>${records(arr.slice().reverse())}</div></div>`;
 const mb=document.getElementById("modal");
 mb.addEventListener("click",function(e){if(e.target.closest("#detailClose")||e.target===mb.firstElementChild)closeModal()});
}
function accounts(){const total=state.accounts.reduce((s,a)=>s+accBal(a),0);return `<div class="page"><div class="card account-card"><div class="account-card-head"><div class="hero">💰 目前總資產</div><div class="account-total">${money(total)}</div><div class="small">所有帳戶餘額加總</div></div>${state.accounts.map(a=>`<button class="account-item" type="button" onclick="editAccount('${a.id}')"><span class="account-icon">${a.emoji||"💵"}</span><span class="account-info"><span class="account-name">${esc(a.name)}</span><span class="account-meta">初始餘額 ${money(a.initial)}</span></span><span class="account-balance">${money(accBal(a))}</span><span class="account-arrow">›</span></button>`).join('')}<button class="account-add" type="button" onclick="addAccount()">＋ 新增帳戶</button></div><div class="card"><div class="row"><b>帳戶規則</b></div><div class="small" style="line-height:1.8;margin-top:8px">收入會增加指定帳戶，支出會扣除指定帳戶；沒有選擇帳戶時，預設使用 💵 現金。</div></div></div>`}
const accountIcons=[["💵","現金"],["🏦","銀行"],["💳","信用卡"],["👛","錢包"],["🐷","存錢"],["🏠","家用"],["💼","工作"],["🎁","獎金"],["🛒","購物"],["•••","其他"]];
function accountEditor(id=null){const a=id?state.accounts.find(x=>x.id===id):null;const current=a?.emoji||"💵";const title=a?"編輯帳戶名稱":"新增帳戶";document.getElementById("modal").innerHTML=`<div class="modal"><div class="sheet account-edit-sheet"><button type="button" class="close" onclick="closeModal()">×</button><div class="account-edit-head"><div class="account-edit-icon" id="accountEditIcon">${current}</div><div><div class="account-edit-title">${title}</div><div class="account-edit-sub">${a?"修改名稱與圖示":"建立一個新的資產帳戶"}</div></div></div><div class="field"><label>選擇圖示</label><div class="icon-picker">${accountIcons.map(([ic,lab])=>`<div class="icon-wrap"><button type="button" class="icon-option ${ic===current?"sel":""}" onclick="selectAccountIcon('${ic}')">${ic}</button><div class="icon-label">${lab}</div></div>`).join("")}</div></div><div class="field"><label>帳戶名稱</label><input id="accountName" maxlength="30" value="${esc(a?.name||"")}" placeholder="例如：現金、銀行、信用卡…"></div><div class="helper-box">💡 帳戶名稱可以自訂，收入與支出會直接影響這個帳戶的餘額。</div><input type="hidden" id="accountEmoji" value="${esc(current)}">${a?`<div class="edit-actions"><button class="edit-secondary" type="button" onclick="closeModal()">取消</button><button class="edit-primary" type="button" onclick="saveAccountEdit('${id}')">儲存</button></div><button class="modalCancel" style="width:100%;margin-top:10px;color:var(--red)" type="button" onclick="deleteAccount('${id}')">🗑️ 刪除帳戶</button>`:`<div class="edit-actions"><button class="edit-secondary" type="button" onclick="closeModal()">取消</button><button class="edit-primary" type="button" onclick="saveNewAccount()">建立帳戶</button></div>`}</div></div>`}
function selectAccountIcon(icon){const h=document.getElementById("accountEmoji"),p=document.getElementById("accountEditIcon");if(h)h.value=icon;if(p)p.textContent=icon;document.querySelectorAll(".icon-option").forEach(b=>b.classList.toggle("sel",b.textContent===icon));}
function addAccount(){accountEditor()}
function editAccount(id){accountEditor(id)}
function saveNewAccount(){const n=(document.getElementById("accountName")?.value||"").trim();if(!n)return alert("請輸入帳戶名稱");const emoji=document.getElementById("accountEmoji")?.value||"💵";const i=Number(prompt("初始餘額","0"))||0;state.accounts.push({id:"a"+Date.now(),name:n,emoji,initial:i});save();closeModal()}
function saveAccountEdit(id){const a=state.accounts.find(x=>x.id===id);if(!a)return;const n=(document.getElementById("accountName")?.value||"").trim();if(!n)return alert("請輸入帳戶名稱");a.name=n;a.emoji=document.getElementById("accountEmoji")?.value||a.emoji||"💵";save();closeModal()}
function deleteAccount(id){const a=state.accounts.find(x=>x.id===id);if(!a)return;if(state.accounts.length<=1)return alert("至少要保留一個帳戶");if(state.entries.some(e=>e.accountId===id))return alert("這個帳戶已有交易紀錄，請保留帳戶以免歷史資料失去對應。你可以把名稱改成其他名稱。");if(!confirm(`確定刪除「${a.name}」？`))return;state.accounts=state.accounts.filter(x=>x.id!==id);save();closeModal()}
function bind(){document.querySelectorAll(".nav button[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
window.addEventListener("online",()=>{if(cloudUser)syncCloud(false,true)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&cloudUser)syncCloud(false,true)});
window.addEventListener("pageshow",()=>{if(cloudUser)syncCloud(true,true).catch(e=>console.error("頁面重新顯示同步失敗",e))});
window.addEventListener("load",()=>{if(cloudUser)syncCloud(true,true).catch(e=>console.error("開啟後同步失敗",e))});
render();
refreshAuth().then(()=>{if(cloudUser)startCloudAutoSync()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
