<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e7"><link rel="manifest" href="manifest.json"><title>米杯記帳</title>
<style>
:root{--bg:#f7f1e7;--card:#fffaf2;--ink:#40382f;--muted:#8b8176;--line:#eadfd1;--accent:#b77b4b;--green:#63866d;--red:#bd655c;--shadow:0 8px 24px rgba(90,65,40,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;touch-action:manipulation}button,input,select{font:inherit}button{border:0;cursor:pointer}body{overscroll-behavior:none}.app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:92px}header{padding:28px 20px 14px;display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:0}.sub,.small{font-size:12px;color:var(--muted)}
.range-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.range-title{display:block;font-size:20px;line-height:1.25;margin-top:5px;word-break:break-word}
.range-arrows{display:flex;gap:8px;flex-shrink:0}
.range-arrow{width:44px;height:44px;border-radius:50%;background:#eee3d5;color:var(--ink);font-size:18px}
.page{padding:0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:10px 0;box-shadow:var(--shadow)}.hero{font-size:13px;color:var(--muted)}.big{font-size:32px;font-weight:800;margin:5px 0 14px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:13px;border:1px solid var(--line);border-radius:15px}.stat b{display:block;font-size:20px;margin-top:4px}.green{color:var(--green)}.red{color:var(--red)}.pill{display:inline-block;background:#efe3d4;border-radius:999px;padding:7px 11px;font-size:12px;color:var(--ink)}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,250,242,.97);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}.nav button{background:none;color:var(--muted);width:20%;max-width:124px;padding:9px 3px 8px;font-size:12px}.nav .on{color:var(--accent);font-weight:700}.ico{font-size:21px;display:block}.plus{width:54px!important;height:54px;margin:-13px 0 2px;border-radius:50%;background:var(--accent)!important;color:#fff!important;font-size:28px!important;box-shadow:0 7px 18px rgba(183,123,75,.28)}.typebtn{flex:1;padding:13px 10px;border-radius:14px;background:#eee4d7;color:var(--muted);font-weight:700;min-height:48px}
.typebtn.active{background:var(--accent);color:#fff}
.type-switch{display:flex;gap:8px;width:100%;margin-bottom:8px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:#eee4d7;border-radius:14px;padding:4px;margin:14px 0 8px}
.tabs button{background:transparent;color:var(--muted);padding:10px 5px;border-radius:10px;min-height:42px}
.tabs button.active{background:#fffaf2;color:var(--ink);font-weight:800;box-shadow:0 1px 4px rgba(90,65,40,.08)}
.amount{text-align:right;font-size:34px;font-weight:800;padding:12px 4px}.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cat{background:#f4e9dc;border:1px solid transparent;border-radius:14px;padding:12px 5px;text-align:center}.cat.sel{border-color:var(--accent);background:#fff7ed}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.keypad button{padding:14px;background:#f0e5d8;border-radius:13px;font-size:18px}.field{margin:9px 0}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fffdf9;color:var(--ink);outline:none}
.type-switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#eee4d7;border-radius:15px;padding:5px;margin:6px 0 12px}
.type-switch .typebtn{width:100%;min-height:48px;border-radius:11px;background:transparent;color:var(--muted);font-weight:700;font-size:17px}
.type-switch .typebtn.active{background:var(--accent);color:#fff;box-shadow:0 3px 8px rgba(183,123,75,.18)}
.dashboard{overflow:hidden}.dashtitle{font-size:25px;font-weight:800;margin:3px 0 14px}.assetbox{background:#f0e4d6;border-radius:17px;padding:15px;margin-bottom:15px}.assetbox span{display:block;color:var(--muted);font-size:12px}.assetbox strong{display:block;font-size:31px;margin-top:4px}.dashbar{margin:13px 0}.dashtrack{height:10px;background:#e9dfd4;border-radius:99px;overflow:hidden;margin-top:7px}.dashfill{height:100%;background:var(--accent);border-radius:99px;min-width:2px}.dashfill.green{background:var(--green)}.dashfill.red{background:var(--red)}.record{padding:11px 0;border-bottom:1px solid var(--line)}.record:last-child{border-bottom:0}.progress{height:9px;background:#eadfd2;border-radius:99px;overflow:hidden;margin:9px 0}.bar{height:100%;background:var(--accent);border-radius:99px}.bar.over{background:var(--red)}.budgetline{padding:13px 0;border-bottom:1px solid var(--line)}.budgetline:last-child{border-bottom:0}.money{font-weight:750}.empty{text-align:center;color:var(--muted);padding:28px 10px}.modal{position:fixed;inset:0;background:rgba(60,45,35,.28);display:flex;align-items:flex-end;z-index:20}.sheet{background:var(--bg);width:100%;max-width:620px;margin:auto;border-radius:24px 24px 0 0;padding:20px;max-height:90vh;overflow:auto}.close{-webkit-appearance:none;appearance:none;position:absolute;right:16px;top:16px;z-index:50;background:#eadfd2;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--ink);cursor:pointer;touch-action:manipulation}.sheet{position:relative;padding-top:72px}.modal .sheet:before{content:"記一筆";position:absolute;left:20px;top:20px;font-size:22px;font-weight:800}.close{right:16px;top:14px;width:52px;height:52px;font-size:28px;font-weight:800;z-index:999}.modalCancel{width:100%;min-height:52px;margin-top:12px;border-radius:14px;background:#eadfd2;color:var(--ink);font-size:17px;font-weight:800}.entry-sheet.expense-mode{background:#fff4f1}.entry-sheet.income-mode{background:#f1f8f2}.entry-sheet.expense-mode .type-switch{background:#f3dcd8}.entry-sheet.income-mode .type-switch{background:#dcecdf}.entry-sheet.expense-mode .typebtn.active{background:#bd655c}.entry-sheet.income-mode .typebtn.active{background:#63866d}.entry-sheet.expense-mode .cat.sel{border-color:#bd655c;background:#fff0ed}.entry-sheet.income-mode .cat.sel{border-color:#63866d;background:#edf7ef}.entry-sheet.expense-mode .keypad button{background:#f6e2de}.entry-sheet.income-mode .keypad button{background:#e3f0e5}.entry-sheet.expense-mode #saveEntryBtn{background:#bd655c!important}.entry-sheet.income-mode #saveEntryBtn{background:#63866d!important}.entry-sheet.expense-mode .amount{color:#a8524b}.entry-sheet.income-mode .amount{color:#50725a}
</style></head><body><div class="app"><header><div><h1>米杯記帳</h1><div class="sub" id="dateText"></div></div><span class="pill">V15</span></header><main id="root"></main>
<nav class="nav"><button data-page="home">🏠<span class="ico"></span>首頁</button><button data-page="stats">📊<span class="ico"></span>統計</button><button class="plus" onclick="openAdd()">＋</button><button data-page="budget">🎯<span class="ico"></span>預算</button><button data-page="accounts">🏦<span class="ico"></span>帳戶</button></nav></div><div id="modal"></div>
<script>
const KEY="mibeiji_v5";const old=JSON.parse(localStorage.getItem("mibeiji_v4")||localStorage.getItem("mibeiji_v3")||"null");
let state=old||{entries:[],cats:[["🍚","吃飯"],["🏠","房租"],["🚗","交通"],["🎮","娛樂"],["📌","固定支出"]],incomeCats:[["💼","薪水"],["🎁","獎金"],["📈","投資"],["💰","副業"],["🎉","紅包"],["↩️","退款"]],accounts:[{id:"cash",name:"現金",emoji:"💵",initial:0},{id:"bank",name:"銀行",emoji:"🏦",initial:0},{id:"card",name:"信用卡",emoji:"💳",initial:0}],budgets:{}};
if(!state.incomeCats)state.incomeCats=[["💼","薪水"],["🎁","獎金"],["📈","投資"],["💰","副業"],["🎉","紅包"],["↩️","退款"]];
if(!state.budgets)state.budgets={};localStorage.setItem(KEY,JSON.stringify(state));
let page="home",type="expense",amount="",selectedCat=state.cats[0]?.[1]||"吃飯",selectedAccount="";
const money=n=>"$"+Math.round(n||0).toLocaleString("zh-TW"),today=()=>new Date().toISOString().slice(0,10),monthKey=(d=today())=>d.slice(0,7);
document.getElementById("dateText").textContent=new Date().toLocaleDateString("zh-TW",{year:"numeric",month:"long",day:"numeric"});
const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render()},esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function inc(k){return state.entries.filter(e=>e.date.startsWith(k)&&e.type==="income").reduce((s,e)=>s+e.amount,0)}function exp(k){return state.entries.filter(e=>e.date.startsWith(k)&&e.type==="expense").reduce((s,e)=>s+e.amount,0)}
function accBal(a){return a.initial+state.entries.filter(e=>e.accountId===a.id).reduce((s,e)=>s+(e.type==="income"?e.amount:-e.amount),0)}
function spent(k,c){return state.entries.filter(e=>e.date.startsWith(k)&&e.type==="expense"&&e.cat===c).reduce((s,e)=>s+e.amount,0)}
function budget(k,c){return Number(state.budgets[k]?.[c]||0)}function render(){document.querySelectorAll(".nav button[data-page]").forEach(b=>b.classList.toggle("on",b.dataset.page===page));root.innerHTML=page==="home"?home():page==="stats"?stats():page==="budget"?budgetPage():accounts();bind()}
function home(){
 let k=monthKey(),assets=state.accounts.reduce((s,a)=>s+accBal(a),0),income=inc(k),expense=exp(k),net=income-expense;
 let totalB=Object.entries(state.budgets[k]||{}).filter(([x])=>x!=="income").reduce((s,[,v])=>s+Number(v||0),0);
 let rows=state.cats.map(c=>[c[1],spent(k,c[1])]).sort((a,b)=>b[1]-a[1]);
 let max=Math.max(assets,income,expense,Math.abs(net),1);
 const bar=(label,val,cls)=>`<div class="dashbar"><div class="row"><span>${label}</span><b class="${cls||""}">${val<0?"-":""}${money(Math.abs(val))}</b></div><div class="dashtrack"><div class="dashfill ${cls||""}" style="width:${Math.min(100,Math.abs(val)/max*100)}%"></div></div></div>`;
 return `<div class="page">
 <div class="card dashboard"><div class="hero">📊 本月財務總覽</div><div class="dashtitle">${k.replace("-"," 年 ")} 月</div>
 <div class="assetbox"><span>目前總資產</span><strong>${money(assets)}</strong></div>
 ${bar("本月收入",income,"green")}${bar("本月支出",-expense,"red")}${bar("本月淨收入",net,net>=0?"green":"red")}
 </div>
 <div class="card"><div class="row"><b>🎯 本月預算</b><span>${money(expense)} / ${money(totalB)}</span></div><div class="progress"><div class="bar ${totalB&&expense>totalB?"over":""}" style="width:${Math.min(100,totalB?expense/totalB*100:0)}%"></div></div><div class="small">${totalB?(expense>totalB?"已超支 "+money(expense-totalB):"還剩 "+money(totalB-expense)+" 可以使用"):"尚未設定本月預算"}</div></div>
 <div class="card"><div class="row"><b>📌 本月花費排行</b><button class="pill" onclick="page='stats';render()">查看統計 →</button></div>${rows.filter(x=>x[1]>0).slice(0,5).map(x=>`<div class="budgetline"><div class="row"><span>${esc(x[0])}</span><b>${money(x[1])}</b></div></div>`).join("")||'<div class="empty">本月還沒有支出</div>'}</div>
 <div class="card"><div class="row"><b>🕒 最近交易</b><span class="small">${k}</span></div>${records(state.entries.slice().sort((a,b)=>b.id-a.id).slice(0,5))}</div>
 </div>`
}
function closeModal(){const m=document.getElementById("modal"); if(m){m.innerHTML=""; m.onclick=null; m.ontouchend=null;}}
document.addEventListener("click",function(e){if(e.target.closest("#entryClose,#entryCancel")){e.preventDefault();e.stopPropagation();closeModal();}},true);
document.addEventListener("touchend",function(e){if(e.target.closest("#entryClose,#entryCancel")){e.preventDefault();e.stopPropagation();closeModal();}},true);
function openAdd(){
 type="expense"; amount=""; selectedCat=state.cats[0]?.[1]||""; selectedAccount="";
 window._entryNote=""; const modal=document.getElementById("modal"); modal.innerHTML=`<div class="modal" id="entryModal"><div class="sheet entry-sheet expense-mode"><button type="button" class="close" id="entryClose" aria-label="關閉">×</button><div id="entryForm"></div><button type="button" class="modalCancel" id="entryCancel">取消／關閉</button></div></div>`;
 const modalBox=document.getElementById("modal");
 modalBox.onclick=function(e){
   if(e.target===modalBox.firstElementChild || e.target.closest("#entryClose") || e.target.closest("#entryCancel")){ e.preventDefault(); e.stopPropagation(); closeModal(); }
 };
 modalBox.ontouchend=function(e){
   const t=e.target;
   if(t===modalBox.firstElementChild || t.closest("#entryClose") || t.closest("#entryCancel")){ e.preventDefault(); e.stopPropagation(); closeModal(); }
 };
 renderEntryForm();
}
function renderEntryForm(){
 const box=document.getElementById("entryForm"); if(!box)return;
 const sheet=document.querySelector(".entry-sheet"); if(sheet){sheet.classList.toggle("expense-mode",type==="expense");sheet.classList.toggle("income-mode",type==="income");}
 const cats=type==="expense"?state.cats:state.incomeCats;
 box.innerHTML=`<div class="type-switch">
   <button id="expenseBtn" class="typebtn ${type==="expense"?"active":""}" type="button">🔴 支出</button>
   <button id="incomeBtn" class="typebtn ${type==="income"?"active":""}" type="button">🟢 收入</button>
 </div>
 <div class="amount">${money(Number(amount))}</div>
 <div class="catgrid">${cats.map((c,i)=>`<button type="button" class="cat ${selectedCat===c[1]?"sel":""}" data-cat-index="${i}">${c[0]}<br><span class="small">${esc(c[1])}</span></button>`).join("")}
 <button type="button" class="cat" id="addCatBtn">＋<br><span class="small">新增分類</span></button></div>
 <div class="field"><label>帳戶（不指定則不影響帳戶餘額）</label><select id="account"><option value="">不指定帳戶</option>${state.accounts.map(a=>`<option value="${a.id}" ${selectedAccount===a.id?"selected":""}>${a.emoji} ${esc(a.name)}</option>`).join("")}</select></div>
 <div class="field"><input id="note" placeholder="備註（可不填）" value="${esc(window._entryNote||"")}"></div>
 <div class="keypad">${["1","2","3","4","5","6","7","8","9","00","0","⌫"].map(k=>`<button type="button" data-key="${k}">${k}</button>`).join("")}</div>
 <button id="saveEntryBtn" type="button" style="width:100%;padding:14px;margin-top:9px;border-radius:13px;background:var(--accent);color:#fff;font-weight:700">加入${type==="expense"?"支出":"收入"}</button>`;

 document.getElementById("expenseBtn").addEventListener("click",()=>{
   window._entryNote=document.getElementById("note")?.value||"";
   type="expense"; selectedCat=state.cats[0]?.[1]||""; renderEntryForm();
 });
 document.getElementById("incomeBtn").addEventListener("click",()=>{
   window._entryNote=document.getElementById("note")?.value||"";
   type="income"; selectedCat=state.incomeCats[0]?.[1]||""; renderEntryForm();
 });
 box.querySelectorAll("[data-cat-index]").forEach(btn=>btn.addEventListener("click",()=>{
   window._entryNote=document.getElementById("note")?.value||"";
   const list=type==="expense"?state.cats:state.incomeCats;
   selectedCat=list[Number(btn.dataset.catIndex)]?.[1]||""; renderEntryForm();
 }));
 document.getElementById("addCatBtn").addEventListener("click",()=>{
   window._entryNote=document.getElementById("note")?.value||"";
   addIncomeOrExpenseCat();
 });
 box.querySelectorAll("[data-key]").forEach(btn=>btn.addEventListener("click",()=>key(btn.dataset.key)));
 document.getElementById("account").addEventListener("change",e=>selectedAccount=e.target.value);
 document.getElementById("note").addEventListener("input",e=>{window._entryNote=e.target.value});
 document.getElementById("saveEntryBtn").addEventListener("click",addEntry);
}
function key(k){
 if(k==="⌫")amount=amount.slice(0,-1);
 else if(amount.length<9)amount+=k;
 renderEntryForm();
}
function addEntry(){
  const n=Number(amount);
  if(!n || n<=0){alert("請先輸入金額");return;}
  if(!selectedCat){alert("請選擇分類");return;}
  const note=document.getElementById("note")?.value||window._entryNote||"";
  const entry={id:Date.now(),date:today(),type,amount:n,cat:selectedCat,accountId:selectedAccount||"",note};
  state.entries.push(entry);
  localStorage.setItem(KEY,JSON.stringify(state));
  closeModal();
  render();
}
function addIncomeOrExpenseCat(){let n=prompt("新增"+(type==="income"?"收入":"支出")+"分類名稱");if(!n)return;let e=prompt("分類圖示","📌")||"📌";(type==="income"?state.incomeCats:state.cats).push([e,n]);openAdd()}
function records(arr){if(!arr.length)return '<div class="empty">目前沒有紀錄</div>';return arr.map(e=>`<div class="record"><div class="row"><span>${e.type==="income"?"💰":"🧾"} ${esc(e.cat)}</span><span class="${e.type==="income"?"green":"red"} money">${e.type==="income"?"+":"-"}${money(e.amount)}</span></div><div class="small">${e.date}${e.note?" · "+esc(e.note):""}${e.accountId?" · "+esc(state.accounts.find(a=>a.id===e.accountId)?.name||""):" · 不指定帳戶"}</div><button class="small" onclick="del(${e.id})">刪除</button></div>`).join("")}
function del(id){if(confirm("確定刪除這筆紀錄？")){state.entries=state.entries.filter(e=>e.id!==id);save()}}
let statsMode="month", statsDate=new Date().toISOString().slice(0,10), statsStart="", statsEnd="";
function pad(n){return String(n).padStart(2,"0")}
function dateObj(s){let [y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))}
function isoDate(dt){return dt.getUTCFullYear()+"-"+pad(dt.getUTCMonth()+1)+"-"+pad(dt.getUTCDate())}
function rangeForStats(){
  let d=dateObj(statsDate), y=d.getUTCFullYear(), m=d.getUTCMonth(), day=d.getUTCDay();
  if(statsMode==="day") return [statsDate,statsDate];
  if(statsMode==="week"){let mon=(day+6)%7,s=new Date(Date.UTC(y,m,d.getUTCDate()-mon)),e=new Date(Date.UTC(y,m,d.getUTCDate()-mon+6));return [isoDate(s),isoDate(e)]}
  if(statsMode==="month"){let s=new Date(Date.UTC(y,m,1)),e=new Date(Date.UTC(y,m+1,0));return [isoDate(s),isoDate(e)]}
  return [statsStart||statsDate,statsEnd||statsDate];
}
function stats(){
 let [from,to]=rangeForStats(), arr=state.entries.filter(e=>e.date>=from&&e.date<=to), income=arr.filter(e=>e.type==="income").reduce((s,e)=>s+e.amount,0), expense=arr.filter(e=>e.type==="expense").reduce((s,e)=>s+e.amount,0);
 let incs=state.incomeCats.map(c=>[c[0],c[1],arr.filter(e=>e.type==="income"&&e.cat===c[1]).reduce((s,e)=>s+e.amount,0)]).filter(x=>x[2]>0).sort((a,b)=>b[2]-a[2]);
 let cats=state.cats.map(c=>[c[0],c[1],arr.filter(e=>e.type==="expense"&&e.cat===c[1]).reduce((s,e)=>s+e.amount,0)]).filter(x=>x[2]>0).sort((a,b)=>b[2]-a[2]);
 let label=statsMode==="day"?from:from+" ～ "+to;
 let daily={};arr.forEach(e=>{daily[e.date]=(daily[e.date]||0)+(e.type==="income"?e.amount:-e.amount)});
 let days=Object.entries(daily).sort((a,b)=>a[0].localeCompare(b[0]));
 return `<div class="page">
 <div class="card"><div class="range-head"><div><div class="hero">📅 查看期間</div><b class="range-title">${label}</b></div><div class="range-arrows"><button class="range-arrow" onclick="moveStats(-1)" aria-label="上一段">←</button><button class="range-arrow" onclick="moveStats(1)" aria-label="下一段">→</button></div></div>
 <div class="tabs">${["day","week","month","custom"].map(x=>`<button class="${statsMode===x?"active":""}" onclick="statsMode='${x}';render()">${x==="day"?"日":x==="week"?"週":x==="month"?"月":"自訂"}</button>`).join("")}</div>
 ${statsMode==="custom"?`<div class="grid2"><div class="field"><label>開始日期</label><input id="statsStart" type="date" value="${statsStart||from}"></div><div class="field"><label>結束日期</label><input id="statsEnd" type="date" value="${statsEnd||to}"></div></div><button onclick="applyCustomRange()" style="width:100%;padding:13px;border-radius:13px;background:var(--accent);color:#fff;font-weight:700">查看這段期間</button>`:`<div class="small" style="margin-top:8px">可用左右箭頭快速切換${statsMode==="day"?"日期":statsMode==="week"?"週次":"月份"}</div>`}</div>
 <div class="card"><div class="grid2"><div class="stat">💰 收入<b class="green">${money(income)}</b></div><div class="stat">🔴 支出<b class="red">${money(expense)}</b></div></div><div class="stat" style="margin-top:10px">🟢 淨金流<b class="${income-expense>=0?"green":"red"}">${income-expense>=0?"+":"-"}${money(Math.abs(income-expense))}</b></div></div>
 <div class="card"><b>📈 每日金流</b>${days.length?days.map(([d,v])=>`<div class="budgetline"><div class="row"><span>${d}</span><b class="${v>=0?"green":"red"}">${v>=0?"+":"-"}${money(Math.abs(v))}</b></div></div>`).join(""):'<div class="empty">這段期間沒有交易</div>'}</div>
 <div class="card"><b>🟢 收入來源</b>${incs.length?incs.map(x=>`<div class="budgetline"><div class="row"><span>${x[0]} ${esc(x[1])}</span><b class="green">${money(x[2])}</b></div></div>`).join(""):'<div class="empty">沒有收入</div>'}</div>
 <div class="card"><b>🔴 支出分類</b>${cats.length?cats.map(x=>`<div class="budgetline"><div class="row"><span>${x[0]} ${esc(x[1])}</span><b class="red">${money(x[2])}</b></div></div>`).join(""):'<div class="empty">沒有支出</div>'}</div>
 <div class="card"><b>🧾 這段期間的交易</b>${records(arr.slice().sort((a,b)=>b.id-a.id))}</div></div>`
}
function applyCustomRange(){let s=document.getElementById("statsStart").value,e=document.getElementById("statsEnd").value;if(!s||!e)return alert("請選擇開始與結束日期");if(s>e)return alert("開始日期不能晚於結束日期");statsStart=s;statsEnd=e;statsDate=s;statsMode="custom";render()}
function moveStats(dir){
 let d=dateObj(statsDate);
 if(statsMode==="day")d.setUTCDate(d.getUTCDate()+dir);
 else if(statsMode==="week")d.setUTCDate(d.getUTCDate()+dir*7);
 else if(statsMode==="month")d.setUTCMonth(d.getUTCMonth()+dir);
 else {let s=dateObj(statsStart||statsDate),e=dateObj(statsEnd||statsDate);let span=Math.max(1,Math.round((e-s)/86400000)+1);s.setUTCDate(s.getUTCDate()+dir*span);e.setUTCDate(e.getUTCDate()+dir*span);statsStart=isoDate(s);statsEnd=isoDate(e);statsDate=statsStart;return render()}
 statsDate=isoDate(d);render()
}
function budgetPage(){let k=monthKey(),bs=state.budgets[k]||{},total=Object.entries(bs).filter(([x])=>x!=="income").reduce((s,[,v])=>s+Number(v||0),0),expected=Number(bs.income||0);return `<div class="page"><div class="card"><div class="row"><div><div class="hero">${k} 預算計畫</div><div class="big">${money(expected)}</div><div class="small">預期收入</div></div><button class="pill" onclick="setExpectedIncome()">設定預期收入</button></div><div class="grid2" style="margin-top:12px"><div class="stat">預計支出<b>${money(total)}</b></div><div class="stat">實際支出<b class="red">${money(exp(k))}</b></div></div></div><div class="card"><div class="row"><b>支出預算分配</b><button class="pill" onclick="addCat()">＋分類</button></div>${state.cats.map(c=>{let b=budget(k,c[1]),s=spent(k,c[1]),p=b?s/b*100:0;return `<div class="budgetline"><div class="row"><span>${c[0]} ${esc(c[1])}</span><span class="${p>100?"red":""}">${money(s)} / ${money(b)}</span></div><div class="progress"><div class="bar ${p>100?"over":""}" style="width:${Math.min(100,p)}%"></div></div><div class="row small"><span>${b?(p>100?"超支 "+money(s-b):"剩餘 "+money(b-s)):"尚未設定"}</span><span><button class="pill" onclick="setBudget('${esc(c[1])}')">設定</button> <button class="pill" onclick="detail('${esc(c[1])}')">明細</button></span></div></div>`}).join("")}</div><div class="card"><b>📅 本月預期 vs 實際</b><div class="budgetline"><div class="row"><span>預期收入</span><b>${money(expected)}</b></div><div class="row"><span>實際收入</span><b class="green">${money(inc(k))}</b></div><div class="row"><span>差額</span><b class="${inc(k)-expected>=0?"green":"red"}">${inc(k)-expected>=0?"+":"-"}${money(Math.abs(inc(k)-expected))}</b></div></div><div class="budgetline"><div class="row"><span>預計支出</span><b>${money(total)}</b></div><div class="row"><span>實際支出</span><b class="red">${money(exp(k))}</b></div><div class="row"><span>差額</span><b class="${exp(k)<=total?"green":"red"}">${exp(k)<=total?"還省下 ":"超支 "}${money(Math.abs(total-exp(k)))}</b></div></div></div></div>`}
function setExpectedIncome(){let k=monthKey(),v=prompt("本月預期收入",state.budgets[k]?.income||0);if(v!==null){state.budgets[k]=state.budgets[k]||{};state.budgets[k].income=Number(v)||0;save()}}
function setBudget(c){let k=monthKey(),v=prompt("設定「"+c+"」本月預算",budget(k,c));if(v!==null){state.budgets[k]=state.budgets[k]||{};state.budgets[k][c]=Number(v)||0;save()}}
function addCat(){let n=prompt("新增支出分類名稱");if(!n)return;state.cats.push([prompt("圖示","📌")||"📌",n]);save()}
function detail(c){let k=monthKey(),arr=state.entries.filter(e=>e.date.startsWith(k)&&e.type==="expense"&&e.cat===c);document.getElementById("modal").innerHTML=`<div class="modal"><div class="sheet entry-sheet expense-mode"><button type="button" class="close" id="detailClose" onclick="closeModal()" ontouchend="closeModal()">×</button><h2>${esc(c)}</h2><div class="grid2"><div class="stat">預算<b>${money(budget(k,c))}</b></div><div class="stat">已花<b class="red">${money(spent(k,c))}</b></div></div>${records(arr.slice().reverse())}</div></div>`;
 const mb=document.getElementById("modal");
 mb.addEventListener("click",function(e){if(e.target.closest("#detailClose")||e.target===mb.firstElementChild)closeModal()});
}
function accounts(){return `<div class="page"><div class="card"><b>我的帳戶</b>${state.accounts.map(a=>`<div class="budgetline"><div class="row"><span>${a.emoji} ${esc(a.name)}</span><b>${money(accBal(a))}</b></div><div class="small">初始餘額 ${money(a.initial)}</div></div>`).join("")}</div><div class="card"><div class="row"><b>帳戶規則</b><button class="pill" onclick="addAccount()">＋新增</button></div><div class="small" style="line-height:1.8;margin-top:8px">指定帳戶的收入／支出會影響該帳戶；不指定帳戶只進總帳與統計。</div></div></div>`}
function addAccount(){let n=prompt("帳戶名稱");if(!n)return;let i=Number(prompt("初始餘額","0"))||0;state.accounts.push({id:"a"+Date.now(),name:n,emoji:"🏦",initial:i});save()}
function bind(){document.querySelectorAll(".nav button[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
